name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"] # Change this if your default branch is "master"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # This step creates the 'setup_pages' output your snippet needs
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      # --- YOUR SNIPPET ---
      - name: Build with Next.js
        run: |
          npm run build
        env:
          NEXT_PUBLIC_PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Next.js static export directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
